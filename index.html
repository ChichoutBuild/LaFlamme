<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Flamme</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B1026;
    --bg-panel:#141B3C;
    --line:#2A3366;
    --text-main:#F5F3ED;
    --text-soft:#A8B3E8;
    --gold:#F2C879;
    --gold-soft:#E8B96A55;
    --blush:#F4A6A6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #1B2456 0%, var(--bg-deep) 60%),
      var(--bg-deep);
    color:var(--text-main);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* Starfield */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute; background:#fff; border-radius:50%;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }
  @media (prefers-reduced-motion: reduce){
    .star{animation:none; opacity:.4;}
  }

  main{
    position:relative; z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:2.5rem 1.25rem 4rem;
  }

  /* HEADER */
  header{
    text-align:center;
    margin-bottom:2.25rem;
  }
  .eyebrow{
    font-size:.7rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text-soft);
    margin-bottom:.6rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.9rem, 6vw, 2.75rem);
    line-height:1.15;
    background:linear-gradient(180deg, #FFFFFF 0%, var(--text-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  section{
    background:linear-gradient(180deg, var(--bg-panel) 0%, #101636 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1.75rem 1.5rem;
    margin-bottom:1.25rem;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    font-weight:500;
    color:var(--gold);
    text-align:center;
    margin-bottom:1.1rem;
  }

  /* COUNTDOWN */
  .countdown-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:.6rem;
  }
  .cd-cell{
    text-align:center;
    background:rgba(242,200,121,.06);
    border:1px solid var(--gold-soft);
    border-radius:14px;
    padding:.75rem .25rem;
  }
  .cd-num{
    font-family:'Fraunces', serif;
    font-size:clamp(1.4rem, 6vw, 2rem);
    color:var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .cd-label{
    font-size:.65rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-soft);
    margin-top:.15rem;
  }
  .cd-done{
    text-align:center;
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:var(--gold);
    padding:.5rem 0;
  }

  /* DAY COUNTER / MOON PATH */
  .day-count-text{
    text-align:center;
    font-size:1rem;
    color:var(--text-soft);
    margin-bottom:1.1rem;
  }
  .day-count-text strong{
    color:var(--text-main);
    font-family:'Fraunces', serif;
    font-size:1.2rem;
  }
  .moon-path{
    display:flex;
    align-items:center;
    gap:4px;
    overflow-x:auto;
    padding:.5rem .1rem 1rem;
    scrollbar-width:thin;
  }
  .moon-path::-webkit-scrollbar{height:4px;}
  .moon-path::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .night-dot{
    flex:0 0 auto;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--line);
    position:relative;
  }
  .night-dot.past{
    background:var(--text-soft);
  }
  .night-dot.today{
    background:var(--gold);
    width:20px; height:20px;
    box-shadow:0 0 0 4px var(--gold-soft), 0 0 14px var(--gold);
  }
  .night-dot.future{
    background:var(--line);
  }
  .path-line{
    flex:1;
    height:1px;
    background:var(--line);
    min-width:6px;
  }

  /* CHALLENGE */
  .challenge-card{
    background:rgba(244,166,166,.06);
    border:1px solid #F4A6A655;
    border-radius:16px;
    padding:1.4rem 1.2rem;
    text-align:center;
  }
  .challenge-time{
    display:inline-block;
    font-size:.7rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--blush);
    border:1px solid #F4A6A655;
    border-radius:999px;
    padding:.25rem .75rem;
    margin-bottom:.85rem;
  }
  .challenge-text{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    line-height:1.5;
    color:var(--text-main);
  }
  .challenge-waiting{
    color:var(--text-soft);
    font-size:.9rem;
    margin-top:.6rem;
  }

  footer{
    text-align:center;
    font-size:.75rem;
    color:var(--text-soft);
    opacity:.6;
    margin-top:2rem;
  }

  @media (max-width:400px){
    .countdown-grid{gap:.4rem;}
    section{padding:1.4rem 1rem;}
  }
</style>
</head>
<body>

<div id="stars"></div>

<main>

  <header>
    <div class="eyebrow">Pour toi</div>
    <h1>De quoi entretenir la flamme ✦</h1>
  </header>

  <!-- COMPTE À REBOURS -->
  <section>
    <div class="section-title">Je rentre chez moiii, grosse surprise !</div>
    <div id="countdown" class="countdown-grid" aria-live="polite"></div>
  </section>

  <!-- JOURS SANS SE VOIR -->
  <section>
    <div class="day-count-text" id="dayCountText"></div>
    <div class="moon-path" id="moonPath" aria-hidden="true"></div>
  </section>

  <!-- DÉFI DU JOUR -->
  <section>
    <div class="section-title">Le défi du moment</div>
    <div class="challenge-card">
      <span class="challenge-time" id="challengeTime">--:--</span>
      <div class="challenge-text" id="challengeText">Défi à préparer ✦</div>
      <div class="challenge-waiting" id="challengeWaiting"></div>
    </div>
  </section>

  <div style="text-align:center; margin-top:.5rem;">
    <button id="notifBtn" style="background:transparent; border:1px solid var(--gold-soft); color:var(--gold); font-family:'Manrope',sans-serif; font-size:.8rem; padding:.55rem 1.1rem; border-radius:999px; cursor:pointer;">
      Activer les notifications
    </button>
  </div>


</main>

<script>
/* ============================================================
   CONFIG — Supabase
   ============================================================ */
const SUPABASE_URL = "https://qfmzroxwpeavupbmavpz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbXpyb3h3cGVhdnVwYm1hdnB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODcyNzIsImV4cCI6MjEwMjQ2MzI3Mn0.ThiXBNC07QQONVm9YZyCIMCGnIxf96CE1bmlP6qWWBw";

/* ============================================================
   CONFIG — dates clés
   ============================================================ */
const START_DATE   = new Date(2026, 7, 7, 0, 0, 0);   // vendredi 7 août 2026 = jour 1
const END_DATE     = new Date(2026, 7, 22, 18, 0, 0); // samedi 22 août 2026, 18h00 = retrouvailles
const TOTAL_DAYS   = 16; // du 7 au 22 août inclus

/* ============================================================
   DÉFIS — repli local si Supabase ne répond pas / table vide
   pour ce jour. Sert de filet de sécurité.
   ============================================================ */
const FALLBACK_CHALLENGES = {
  1: {
    morning: { time: "11:00", text: "Défi à préparer ✦" },
    evening: { time: "20:00", text: "Défi à préparer ✦" }
  }
};

/* ============================================================
   COMPTE À REBOURS
   ============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }

function renderCountdown(){
  const el = document.getElementById('countdown');
  const now = new Date();
  const diff = END_DATE - now;

  if (diff <= 0){
    el.innerHTML = '<div class="cd-done">C\'est aujourd\'hui. 🤍</div>';
    return;
  }

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins  = Math.floor((diff % 3600000) / 60000);
  const secs  = Math.floor((diff % 60000) / 1000);

  el.innerHTML = `
    <div class="cd-cell"><div class="cd-num">${days}</div><div class="cd-label">jours</div></div>
    <div class="cd-cell"><div class="cd-num">${pad(hours)}</div><div class="cd-label">heures</div></div>
    <div class="cd-cell"><div class="cd-num">${pad(mins)}</div><div class="cd-label">min</div></div>
    <div class="cd-cell"><div class="cd-num">${pad(secs)}</div><div class="cd-label">sec</div></div>
  `;
}

/* ============================================================
   JOURS SANS SE VOIR + CHEMIN DE NUITS
   ============================================================ */
function dayNumberToday(){
  const now = new Date();
  const startMidnight = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const diffDays = Math.floor((now - startMidnight) / 86400000) + 1;
  return Math.min(Math.max(diffDays, 1), TOTAL_DAYS);
}

function renderDayCounter(){
  const day = dayNumberToday();
  document.getElementById('dayCountText').innerHTML =
    `Jour <strong>${day}</strong> / ${TOTAL_DAYS} où on s'est pas vus`;

  const path = document.getElementById('moonPath');
  path.innerHTML = '';
  for (let i = 1; i <= TOTAL_DAYS; i++){
    const dot = document.createElement('div');
    dot.className = 'night-dot ' + (i < day ? 'past' : i === day ? 'today' : 'future');
    path.appendChild(dot);
    if (i < TOTAL_DAYS){
      const line = document.createElement('div');
      line.className = 'path-line';
      path.appendChild(line);
    }
  }
  // scroll auto jusqu'au jour actuel
  requestAnimationFrame(() => {
    const todayDot = path.querySelector('.today');
    if (todayDot) todayDot.scrollIntoView({inline:'center', block:'nearest'});
  });
}

/* ============================================================
   DÉFI DU MOMENT (matin avant 20h -> défi 11h, sinon défi 20h)
   Va chercher le texte dans la table Supabase "challenges"
   (colonnes: day, time_slot ["morning"/"evening"], content).
   Si rien n'est trouvé (pas encore de contenu ce jour-là),
   on retombe sur FALLBACK_CHALLENGES puis sur un message par défaut.
   ============================================================ */
async function renderChallenge(){
  const day = dayNumberToday();
  const now = new Date();
  const isEvening = now.getHours() >= 20;
  const slotKey = isEvening ? 'evening' : 'morning';
  const defaultTime = isEvening ? '20:00' : '11:00';

  const timeEl = document.getElementById('challengeTime');
  const textEl = document.getElementById('challengeText');

  timeEl.textContent = defaultTime;

  try {
    const url = `${SUPABASE_URL}/rest/v1/challenges?day=eq.${day}&time_slot=eq.${slotKey}&select=content`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      }
    });

    if (res.ok){
      const rows = await res.json();
      if (rows.length > 0 && rows[0].content){
        textEl.textContent = rows[0].content;
        return;
      }
    }
  } catch (err){
    // pas de réseau / Supabase indisponible -> on utilise le repli local
  }

  const fallbackDay = FALLBACK_CHALLENGES[day];
  if (fallbackDay && fallbackDay[slotKey]){
    timeEl.textContent = fallbackDay[slotKey].time;
    textEl.textContent = fallbackDay[slotKey].text;
  } else {
    textEl.textContent = 'Défi à préparer ✦';
  }
}

/* ============================================================
   STARFIELD (décoratif, léger)
   ============================================================ */
function renderStars(){
  const container = document.getElementById('stars');
  const count = window.innerWidth < 480 ? 45 : 80;
  for (let i = 0; i < count; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 1.6 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(s);
  }
}

/* ============================================================
   NOTIFICATIONS — Web Push natif (sans service tiers)
   ============================================================ */
const VAPID_PUBLIC_KEY = "BOSfY-G1hvttR62-coB5VYthK6O1urfvjQVc-kTuy7pGlwxrM7K7oFH8tTzlzmhyCyKy-nYeF_lFGajd419fOFs";

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function subscribeToPush(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    console.warn('Push non supporté sur ce navigateur.');
    return;
  }
  try {
    const registration = await navigator.serviceWorker.register('/sw.js');

    let permission = Notification.permission;
    if (permission === 'default'){
      permission = await Notification.requestPermission();
    }
    if (permission !== 'granted') return;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription){
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const raw = subscription.toJSON();
    await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        endpoint: raw.endpoint,
        p256dh: raw.keys.p256dh,
        auth: raw.keys.auth
      })
    });
  } catch (err){
    console.error('Erreur abonnement push:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  subscribeToPush();
  const btn = document.getElementById('notifBtn');
  if (btn){
    btn.addEventListener('click', subscribeToPush);
  }
});

/* ============================================================
   INIT
   ============================================================ */
renderStars();
renderDayCounter();
renderChallenge();
renderCountdown();
setInterval(renderCountdown, 1000);
setInterval(renderChallenge, 60000);
  window.testNotif = async function(
  title = "💛 Notification de test",
  body = "Si tu vois ça, les notifications fonctionnent !"
){
  if (Notification.permission !== "granted") {
    console.error("Notifications non autorisées");
    return;
  }

  const registration = await navigator.serviceWorker.getRegistration();

  if (!registration) {
    console.error("Service Worker introuvable");
    return;
  }

  registration.showNotification(title, {
    body,
    icon: "/icon-192.png",
    badge: "/icon-192.png",
    vibrate: [200, 100, 200]
  });

  console.log("Notification envoyée");
};
</script>

</body>
</html>
